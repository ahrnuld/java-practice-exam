# Questions: Week 1, lesson 1 - Java for C# developers

Source: lectures/Week 01 - Lesson 01 - Java for C# developers.pdf

## 1. A developer compiles `Invoice.java` on a Windows laptop and copies only the resulting `Invoice.class` to a Linux server that has a JVM installed. What happens when the class is started on the server?

- A. It fails, because the `.class` file contains x86 machine code for Windows and must be recompiled on Linux.
- B. It runs: the `.class` file holds bytecode, and the Linux JVM turns that bytecode into machine code for its own CPU while the program runs.
- C. It runs, but only in interpreted mode, because Just-In-Time compilation only works on the operating system the code was compiled on.
- D. It fails until `javap` is run on the server to convert the bytecode into Java source again.

**Answer:** B

**Explanation:** `javac` compiles Java source to platform-independent bytecode, and the OS-specific JVM JIT-compiles that bytecode to machine code at execution time. That is what makes "write once, run anywhere" work.

**Source:** lectures/Week 01 - Lesson 01 - Java for C# developers.pdf — The idea behind Java

## 2. Given the classes below in package `nl.store.model`, a class `StockReport` in package `nl.store.ui` (not a subclass of `Product`) has a `Product p`. Which field can `StockReport` access directly as `p.<field>`?

```java
package nl.store.model;

public class Product {
    String sku;
    private double price;
    protected int stock;
    public String name;
}
```

- A. `sku`
- B. `name`
- C. `stock`
- D. `price`

**Answer:** B

**Explanation:** Writing no modifier makes a member package-private (visible only inside `nl.store.model`), `protected` adds subclasses, and `private` stays inside the class; only `public` reaches an unrelated class in another package.

**Source:** lectures/Week 01 - Lesson 01 - Java for C# developers.pdf — Encapsulation in Java

## 3. What does this code print?

```java
class Shape {
    public double area() { return 0; }
}

class Square extends Shape {
    private double side = 2;
    public double Area() { return side * side; }
}

Shape s = new Square();
System.out.println(s.area());
```

- A. `0.0`
- B. `4.0`
- C. Nothing: it does not compile, because `Square` must override `area()`.
- D. Nothing: it throws an exception because `Area()` hides `area()`.

**Answer:** A

**Explanation:** `Area()` with a capital A is a second, unrelated method, so `area()` is not overridden and `Shape`'s version runs. Writing `@Override` would have made the compiler report the mistake.

**Source:** lectures/Week 01 - Lesson 01 - Java for C# developers.pdf — Method overriding and @Override

## 4. What does this code print?

```java
record Ticket(String code, int seat) { }

Ticket first  = new Ticket("X9", 14);
Ticket second = new Ticket("X9", 14);
System.out.println(first.equals(second) + " " + (first == second));
```

- A. `false false`
- B. `true false`
- C. `true true`
- D. `false true`

**Answer:** B

**Explanation:** A record gets `equals()` (and `hashCode()`) for free, comparing the component values, so the two are equal; `==` still compares references, and these are two different objects.

**Source:** lectures/Week 01 - Lesson 01 - Java for C# developers.pdf — Modern Java: records

## 5. What does this code print?

```java
int[][] seats = new int[3][5];
seats[2][4] = 1;
System.out.println(seats.length + " " + seats[0].length + " " + seats[1][1]);
```

- A. `5 3 0`
- B. `15 5 0`
- C. `3 5 0`
- D. `3 5 null`

**Answer:** C

**Explanation:** `new int[3][5]` is 3 rows of 5 columns, so `seats.length` is 3 and each row has length 5; `int` is a primitive, so untouched cells hold `0`, not `null`.

**Source:** lectures/Week 01 - Lesson 01 - Java for C# developers.pdf — Primitive types and arrays

# Questions: Week 1, lesson 2 - Collections and generics

Source: lectures/Week 01 - Lesson 02 - Collections and generics.pdf

## 6. A developer coming from C# writes `List<int> scores = new ArrayList<>();`. What happens?

- A. It compiles, and Java stores the values as primitives for speed.
- B. It compiles, but adding a value throws an exception at runtime.
- C. It does not compile; the list has to be declared as `List<Integer>`.
- D. It does not compile; the variable has to be declared as `ArrayList<int>` instead of `List<int>`.

**Answer:** C

**Explanation:** Unlike in C#, a Java collection cannot contain primitives; they must be wrapped in wrapper classes such as `Integer`.

**Source:** lectures/Week 01 - Lesson 02 - Collections and generics.pdf — Collection framework (1 of 2)

## 7. What does this code print?

```java
Set<String> codes = new HashSet<>();
System.out.print(codes.add("NL") + " ");
System.out.print(codes.add("BE") + " ");
System.out.print(codes.add("NL") + " ");
System.out.println(codes.size());
```

- A. `true true true 3`
- B. `true true false 3`
- C. `true true false 2`
- D. `true true` and then an exception, because duplicates are not allowed

**Answer:** C

**Explanation:** A `Set` never holds an element more than once: adding a duplicate does not throw, `add` simply returns `false` and the set is unchanged.

## 34. What does this code print?

    void approve() { state.approve(this); }

    public void submit(Doc d)  { System.out.print("R "); d.setState(new InReview()); }

doc.submit();

- C. `x R x P L `
- D. `x R x P P `

**Explanation:** `setOnFinished` never fires on an `INDEFINITE` timeline; stop it yourself from inside the `KeyFrame` handler and show the results there.

**Source:** lectures/Week 06 - Lesson 02 - Concurrency for JavaFX.pdf — Timeline: play, pause, stop

## 40. A `ProgressBar` was bound with `progressBar.progressProperty().bind(importTask.progressProperty());`. When the user starts a second import, the code runs `progressBar.setProgress(0);` to reset the bar. What happens?

- A. The bar resets to 0 and stays bound to the old task.
- B. An exception is thrown, because a bound property cannot be set; unbind first.
- C. The bar resets, and the binding automatically moves to the new task.
- D. Nothing happens, because a finished task releases its bindings.

**Answer:** B

**Explanation:** A bound property cannot be set from code, so unbind when the task is done if the control gets reused.

**Source:** lectures/Week 06 - Lesson 02 - Concurrency for JavaFX.pdf — Binding a ProgressBar to a Task

</script>

<script>
(function () {
  "use strict";
  const STORE_KEY = "java-practice-exam-v1";

  // ---------- Parse the exam markdown ----------
  function parseExam(md) {
    const lines = md.replace(/\r/g, "").split("\n");
    const lectures = [];
    const questions = [];
    let lec = null, q = null, code = null;
    for (const line of lines) {
      if (code) {
        if (line.startsWith("```")) { q.blocks.push(code.join("\n")); code = null; }
        else code.push(line);
        continue;
      }
      if (line.startsWith("```")) { if (q) code = []; continue; }
      let m;
      if ((m = line.match(/^# Questions: (.+?) - (.+)$/))) {
        lec = { id: lectures.length, label: m[1].trim(), title: m[2].trim(), file: "", questions: [] };
        lectures.push(lec); q = null; continue;
      }
      if ((m = line.match(/^Source: (.+)$/)) && lec && !q) { lec.file = m[1].trim(); continue; }
      if ((m = line.match(/^## (\d+)\. (.+)$/))) {
        q = { n: +m[1], prompt: m[2].trim(), blocks: [], options: [], answer: "", explanation: "", section: "", lec: lec };
        questions.push(q); lec.questions.push(q); continue;
      }
      if (!q) continue;
      if ((m = line.match(/^- ([A-D])\. (.+)$/))) { q.options.push({ key: m[1], text: m[2] }); continue; }
      if ((m = line.match(/^\*\*Answer:\*\* ([A-D])/))) { q.answer = m[1]; continue; }
      if ((m = line.match(/^\*\*Explanation:\*\* (.+)$/))) { q.explanation = m[1]; continue; }
      if ((m = line.match(/^\*\*Source:\*\* .+? — (.+)$/))) { q.section = m[1].trim(); continue; }
    }
    return { lectures, questions };
  }

  const exam = parseExam(document.getElementById("exam-md").textContent);
  const Q = exam.questions;

  // ---------- Helpers ----------
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function lectureName(lec) { return lec.title; }
  function weekLabel(lec) {
    return lec.label.replace(/,\s*lesson/i, " · Lesson");
  }

  // ---------- State ----------
  let state = load() || fresh("", "exam", "start");
  function fresh(name, mode, screen) {
    return { name: name, mode: mode || "exam", screen: screen || "quiz", idx: 0, answers: {}, checked: {}, finished: false };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object" && s.answers) return s;
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  const app = document.getElementById("app");

  function render() {
    save();
    if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "results") renderResults();
    else renderStart();
    window.scrollTo(0, 0);
  }

  // ---------- Start screen ----------
  function answeredCount() {
    return Object.keys(isExam() ? state.answers : state.checked).length;
  }
  function isExam() { return state.mode === "exam"; }

  function renderStart() {
    const answered = answeredCount();
    const resume = answered > 0 && answered < Q.length && !state.finished;
    const mode = state.mode || "exam";
    app.innerHTML = `
      <header class="qhead">
        <p class="eyebrow">Java &amp; JavaFX · Practice exam</p>
        <h1>Practise for the Java exam</h1>
        <p class="muted">${Q.length} multiple-choice questions taken from the lectures. At the end you get your score and a list of the lectures to study again.</p>
      </header>
      <section class="sheet">
        <form id="start-form" class="start-form" novalidate>
          <div class="field">
            <label for="student-name">Your name <span class="muted" style="font-weight:400">(optional)</span></label>
            <input type="text" id="student-name" autocomplete="name" maxlength="60" placeholder="For example: Sam de Vries" value="${esc(state.name || "")}">
            <p class="hint" id="name-hint">If you fill it in, it appears on your result.</p>
          </div>
          <fieldset class="modes">
            <legend>How do you want to practise?</legend>
            <label class="mode" for="mode-exam">
              <input type="radio" name="mode" id="mode-exam" value="exam" ${mode === "exam" ? "checked" : ""}>
              <span class="mode-body">
                <span class="mode-title">Exam mode <span class="tag">Recommended</span></span>
                <span class="mode-desc">Answer all questions like on the real exam. You can go back and change answers. You see the correct answers, explanations and study advice at the end.</span>
              </span>
            </label>
            <label class="mode" for="mode-practice">
              <input type="radio" name="mode" id="mode-practice" value="practice" ${mode === "practice" ? "checked" : ""}>
              <span class="mode-body">
                <span class="mode-title">Learning mode</span>
                <span class="mode-desc">Check each answer straight away and read the explanation before you go to the next question.</span>
              </span>
            </label>
          </fieldset>
          <div class="callout">
            <span class="eyebrow">How to get the most out of this</span>
            <ol class="advice">
              <li><b>Take it in exam mode first</b>, without your notes. Recalling an answer yourself is what makes it stick, and your score shows what you really know.</li>
              <li><b>Study the slides the results point you to.</b> Read the explanation of every question you missed, and of any question you guessed.</li>
              <li><b>A few days later, take it again</b>, in exam mode for a fresh measurement, or in learning mode to go over the explanations one by one.</li>
            </ol>
          </div>
        </form>
        <div class="actions">
          <button type="submit" form="start-form" id="start-btn">${resume ? "Start again" : "Start"}</button>
          ${resume ? `<button type="button" class="secondary" id="resume-btn">Continue at question ${Math.min(answered + 1, Q.length)}</button>` : ""}
        </div>
      </section>`;
    const input = document.getElementById("student-name");
    document.getElementById("start-form").addEventListener("submit", e => {
      e.preventDefault();
      const name = input.value.trim();
      const picked = document.querySelector('input[name="mode"]:checked');
      state = fresh(name, picked ? picked.value : "exam");
      render();
    });
    const r = document.getElementById("resume-btn");
    if (r) r.addEventListener("click", () => {
      const name = input.value.trim();
      state.name = name;
      state.screen = "quiz";
      state.idx = Math.min(answered, Q.length - 1);
      render();
    });
  }

  // ---------- Quiz screen ----------
  function score() {
    let s = 0;
    for (const q of Q) if (state.checked[q.n] && state.answers[q.n] === q.answer) s++;
    return s;
  }

  function renderQuiz() {
    const q = Q[state.idx];
    const chosen = state.answers[q.n] || "";
    const checked = !!state.checked[q.n];
    const isLast = state.idx === Q.length - 1;
    const right = chosen === q.answer;
    const exam = isExam();

    const dots = Q.map((x, i) => {
      let c = "dot";
      if (exam) { if (state.answers[x.n]) c += " done"; }
      else if (state.checked[x.n]) c += state.answers[x.n] === x.answer ? " good" : " bad";
      if (i === state.idx) c += " current";
      return `<span class="${c}" title="Question ${x.n}"></span>`;
    }).join("");

    const opts = q.options.map(o => {
      let c = "opt";
      if (checked) {
        if (o.key === q.answer) c += " correct";
        else if (o.key === chosen) c += " wrong";
      } else if (o.key === chosen) c += " selected";
      return `<button type="button" class="${c}" data-key="${o.key}" ${checked ? "disabled" : ""} aria-pressed="${o.key === chosen}">
        <span class="bubble">${o.key}</span><span class="opt-text">${inline(o.text)}</span></button>`;
    }).join("");

    app.innerHTML = `
      <div class="progress">
        <div class="progress-row">
          <div class="seg" role="group" aria-label="Mode">
            <button type="button" data-mode="exam" aria-pressed="${exam}">Exam mode</button>
            <button type="button" data-mode="practice" aria-pressed="${!exam}">Learning mode</button>
          </div>
          <button type="button" class="reset-btn" id="reset-btn">Reset progress</button>
        </div>
        <div class="progress-row">
          <span class="eyebrow">${state.name ? esc(state.name) : "Practice exam"}</span>
          <span class="count">${answeredCount()} of ${Q.length} answered${exam ? "" : ` · ${score()} correct`}</span>
        </div>
        <div class="strip" aria-hidden="true">${dots}</div>
      </div>
      <section class="sheet">
        <div class="qhead">
          <div class="qmeta"><span class="tag">${esc(weekLabel(q.lec))}</span><span class="eyebrow">${esc(lectureName(q.lec))}</span></div>
          <span class="qnum">Question ${q.n} of ${Q.length}</span>
          <p class="prompt">${inline(q.prompt)}</p>
        </div>
        ${q.blocks.map(b => `<pre><code>${esc(b)}</code></pre>`).join("")}
        <div class="opts" role="group" aria-label="Answer options">${opts}</div>
        ${checked ? `
          <div class="feedback ${right ? "good" : "bad"}" role="status">
            <span class="verdict">${right ? "Correct" : `Not quite. The correct answer is ${q.answer}.`}</span>
            <p>${inline(q.explanation)}</p>
            <p class="src">Lecture: ${esc(q.lec.title)} — ${esc(q.section)}</p>
          </div>` : ""}
        <div class="actions">
          ${state.idx > 0 ? `<button type="button" class="secondary" id="prev-btn">Previous</button>` : ""}
          <span class="spacer"></span>
          ${exam
            ? (isLast
                ? `<button type="button" id="finish-btn">Finish and see results</button>`
                : `<button type="button" id="next-btn">Next question</button>`)
            : (checked
                ? `<button type="button" id="next-btn">${isLast ? "See my results" : "Next question"}</button>`
                : `<button type="button" id="check-btn" ${chosen ? "" : "disabled"}>Check answer</button>`)}
        </div>
        <p class="notice" id="finish-note" hidden></p>
        <p class="hint">Keyboard: press A–D to choose, Enter to ${exam ? "go to the next question" : "check or go on"}.</p>
      </section>`;

    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(b.dataset.key)));
    app.querySelectorAll(".seg [data-mode]").forEach(b => b.addEventListener("click", () => {
      if (state.mode === b.dataset.mode) return;
      state.mode = b.dataset.mode;
      finishArmed = false;
      renderQuiz(); save();
    }));
    // Reset needs a second click within a few seconds (the viewer has no confirm()).
    const reset = document.getElementById("reset-btn");
    let resetTimer = null;
    reset.addEventListener("click", () => {
      if (!reset.classList.contains("armed")) {
        reset.classList.add("armed");
        reset.textContent = "Click again to erase all answers";
        resetTimer = setTimeout(() => { reset.classList.remove("armed"); reset.textContent = "Reset progress"; }, 4000);
        return;
      }
      clearTimeout(resetTimer);
      state = fresh(state.name, state.mode, "start");
      render();
    });
    const check = document.getElementById("check-btn");
    if (check) check.addEventListener("click", doCheck);
    const next = document.getElementById("next-btn");
    if (next) {
      next.addEventListener("click", goNext);
      if (!exam || chosen) next.focus({ preventScroll: true });
    }
    const finish = document.getElementById("finish-btn");
    if (finish) finish.addEventListener("click", tryFinish);
    const prev = document.getElementById("prev-btn");
    if (prev) prev.addEventListener("click", () => { state.idx--; render(); });
  }

  function choose(key) {
    const q = Q[state.idx];
    if (state.checked[q.n]) return;
    state.answers[q.n] = key;
    finishArmed = false;
    renderQuiz(); save();
    const c = document.getElementById(isExam() ? (state.idx === Q.length - 1 ? "finish-btn" : "next-btn") : "check-btn");
    if (c) c.focus({ preventScroll: true });
  }

  // Exam mode: finishing with open questions needs a second click (the viewer has no confirm()).
  let finishArmed = false;
  function tryFinish() {
    const open = Q.filter(x => !state.answers[x.n]);
    if (open.length && !finishArmed) {
      finishArmed = true;
      const note = document.getElementById("finish-note");
      note.innerHTML = `You have not answered ${open.length === 1 ? "question" : "questions"} ${open.map(x => x.n).join(", ")}. `
        + `Unanswered questions count as wrong. Click <b>Finish anyway</b> to see your results, or go back with Previous.`;
      note.hidden = false;
      document.getElementById("finish-btn").textContent = "Finish anyway";
      return;
    }
    finishArmed = false;
    for (const x of Q) state.checked[x.n] = true;
    state.finished = true;
    state.screen = "results";
    render();
  }
  function doCheck() {
    const q = Q[state.idx];
    if (!state.answers[q.n]) return;
    state.checked[q.n] = true;
    renderQuiz(); save();
  }
  function goNext() {
    finishArmed = false;
    if (isExam()) {
      if (state.idx < Q.length - 1) { state.idx++; render(); } else tryFinish();
      return;
    }
    if (state.idx < Q.length - 1) {
      state.idx++;
      render();
    } else {
      const firstOpen = Q.findIndex(x => !state.checked[x.n]);
      if (firstOpen >= 0) { state.idx = firstOpen; render(); return; }
      state.finished = true;
      state.screen = "results";
      render();
    }
  }

  document.addEventListener("keydown", e => {
    if (state.screen !== "quiz" || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.tagName === "INPUT") return;
    const k = e.key.toUpperCase();
    const q = Q[state.idx];
    if (["A", "B", "C", "D"].includes(k) && q.options.some(o => o.key === k)) { e.preventDefault(); choose(k); }
    else if (e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON")) {
      e.preventDefault();
      if (isExam()) { if (state.idx === Q.length - 1) tryFinish(); else goNext(); }
      else if (state.checked[q.n]) goNext(); else doCheck();
    }
  });

  // ---------- Results screen ----------
  function status(c, t) {
    const r = c / t;
    if (r === 1) return { cls: "solid", label: "Solid", color: "var(--good-edge)" };
    if (r >= 0.5) return { cls: "review", label: "Review", color: "var(--pv-edge)" };
    return { cls: "study", label: "Study again", color: "var(--bad-edge)" };
  }

  function renderResults() {
    const total = Q.length, s = score(), pct = Math.round((s / total) * 100);
    const rows = exam.lectures.map(l => {
      const c = l.questions.filter(q => state.answers[q.n] === q.answer).length;
      const missed = l.questions.filter(q => state.answers[q.n] !== q.answer);
      return { l, c, t: l.questions.length, missed, ratio: c / l.questions.length };
    }).sort((a, b) => a.ratio - b.ratio || b.missed.length - a.missed.length || a.l.id - b.l.id);

    const weak = rows.filter(r => r.ratio < 1);
    const studyFirst = rows.filter(r => r.ratio < 0.5);
    const firstNames = (studyFirst.length ? studyFirst : weak).slice(0, 3).map(r => `<b>${esc(r.l.title)}</b>`);
    let focusText;
    if (!weak.length) focusText = "You answered every question correctly. Every lecture in this exam looks solid.";
    else focusText = `Start with ${firstNames.length > 1 ? firstNames.slice(0, -1).join(", ") + " and " + firstNames.slice(-1) : firstNames[0]}. `
      + `You missed questions in ${weak.length} of ${rows.length} lectures; each one below lists the slides to revisit.`;

    const lecRows = rows.map(r => {
      const st = status(r.c, r.t);
      const sections = [...new Set(r.missed.map(q => q.section))];
      return `<div class="lec">
        <div>
          <div class="lec-name">${esc(r.l.title)} <span class="chip ${st.cls}">${st.label}</span></div>
          <div class="lec-week">${esc(weekLabel(r.l))}</div>
        </div>
        <div class="lec-score">${r.c} / ${r.t}</div>
        <div class="bar-track" role="img" aria-label="${r.c} of ${r.t} correct"><i style="width:${(r.ratio * 100).toFixed(0)}%;background:${st.color}"></i></div>
        ${sections.length ? `<div class="revisit">
          <span>Revisit these slides:</span>
          <ul>${sections.map(x => `<li>${inline(x)}</li>`).join("")}</ul>
          <span class="file">${esc(r.l.file)}</span>
        </div>` : ""}
      </div>`;
    }).join("");

    const misses = Q.filter(q => state.answers[q.n] !== q.answer);
    const missList = misses.map(q => {
      const yours = q.options.find(o => o.key === state.answers[q.n]);
      const right = q.options.find(o => o.key === q.answer);
      return `<details class="miss">
        <summary>Question ${q.n}: ${inline(q.prompt)}</summary>
        <div class="miss-body">
          ${q.blocks.map(b => `<pre><code>${esc(b)}</code></pre>`).join("")}
          <div class="answer-line">
            <span class="yours">Your answer: ${yours ? `${yours.key}. ${inline(yours.text)}` : "none"}</span>
            <span class="right">Correct: ${right.key}. ${inline(right.text)}</span>
          </div>
          <p>${inline(q.explanation)}</p>
          <p class="src">${esc(q.lec.title)} — ${esc(q.section)}</p>
        </div>
      </details>`;
    }).join("");

    app.innerHTML = `
      <header class="qhead">
        <p class="eyebrow">Practice exam result · ${isExam() ? "Exam mode" : "Learning mode"}</p>
        <h1>${state.name ? esc(state.name) + ", here is" : "Here is"} how you did</h1>
      </header>
      <section class="sheet">
        <div class="score-row">
          <div class="score-big">${s}<small> / ${total}</small></div>
          <div class="score-pct">${pct}% correct</div>
        </div>
        <p class="focus">${focusText}</p>
      </section>
      <section class="sheet">
        <h2>Results per lecture</h2>
        <p class="muted">Weakest lectures first. <b>Study again</b> means less than half correct, <b>Review</b> means at least half, <b>Solid</b> means all correct.</p>
        <div class="lec-rows">${lecRows}</div>
      </section>
      ${misses.length ? `<section class="sheet">
        <h2>Questions you missed (${misses.length})</h2>
        <div>${missList}</div>
      </section>` : ""}
      <div class="actions">
        <button type="button" id="retake-btn">Take the exam again</button>
        <button type="button" class="secondary" id="name-btn">Back to start</button>
      </div>`;
    document.getElementById("retake-btn").addEventListener("click", () => { state = fresh(state.name, state.mode); render(); });
    document.getElementById("name-btn").addEventListener("click", () => { state = fresh(state.name, state.mode, "start"); render(); });
  }

  render();
})();
</script>
<script>
(function () {
  "use strict";
  const KEY = "java-practice-exam-theme";
  const root = document.documentElement;
  const buttons = document.querySelectorAll("[data-theme-set]");
  function apply(mode) {
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));
  }
  let saved = "system";
  try { saved = localStorage.getItem(KEY) || "system"; } catch (e) {}
  apply(saved);
  buttons.forEach(b => b.addEventListener("click", () => {
    apply(b.dataset.themeSet);
    try { localStorage.setItem(KEY, b.dataset.themeSet); } catch (e) {}
  }));
})();
</script>
